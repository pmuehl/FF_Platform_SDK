[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ff-platform-sdk"
version = "0.2.0"
description = "Connects the FF apps to the FF Platform: token verification, signed internal calls, master data sync."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
# router for /intern/* and the dependencies for FastAPI apps
fastapi = ["fastapi>=0.115"]
dev = ["fastapi>=0.115", "httpx>=0.27", "pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ff_platform_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.md"]  # README examples stay as written
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
