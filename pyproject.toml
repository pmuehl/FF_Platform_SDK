[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ff-platform-sdk"
version = "0.1.0"
description = "Anbindung der FF-Apps an die FF Plattform: Token-Prüfung, signierte interne Aufrufe, Stammdaten-Sync."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
# Gegenstellen für /intern/* und die Abhängigkeiten für FastAPI-Apps
fastapi = ["fastapi>=0.115"]
dev = ["fastapi>=0.115", "httpx>=0.27", "pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ff_platform_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.md"]  # Beispiele im README bleiben, wie sie geschrieben sind
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
